name: CI

on:
  pull_request:
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check new migrations are after main
        run: |
          git fetch origin main --depth=1
          tip=$(git ls-tree --name-only origin/main:supabase/migrations | sort | tail -1)
          oldest_new=$(git diff --name-only --diff-filter=A origin/main -- supabase/migrations \
            | xargs -n1 basename | sort | head -1)
          if [ -n "$oldest_new" ] && [[ ! "$oldest_new" > "$tip" ]]; then
            echo "::error::$oldest_new must be renamed to after $tip"
            exit 1
          fi

      - name: Start Supabase local development setup
        run: supabase db start

      - name: Verify generated types are checked in
        run: |
          supabase gen types typescript --local > src/types/db.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/types/db.ts; then
            echo "Detected uncommitted changes in src/types/db.ts after build. See status below:"
            git diff
            exit 1
          fi
